    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playTone(freq, type, duration, delay = 0) {
      if (!soundEnabled) return;
      try {
        const ctx = getAudioContext();
        setTimeout(() => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, ctx.currentTime);
          gain.gain.setValueAtTime(0.06, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + duration);
        }, delay * 1000);
      } catch (e) {
        console.warn("Audio unavailable:", e);
      }
    }

    function playSuccessSound() {
      playTone(523.25, 'sine', 0.15, 0);
      playTone(659.25, 'sine', 0.2, 0.08);

    }

                ${qIdx + 1}
              </span>
              <span class="text-xs font-semibold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-md flex items-center gap-1" title="Momento clave en el video">
                <i class="fa-regular fa-clock"></i> Timestamp [${q.timestamp}]
              </span>
            </div>
          </div>
          <p class="font-semibold text-slate-900 text-sm sm:text-base mb-3">${q.text}</p>
          <div class="grid grid-cols-1 gap-2">
            ${optionsHTML}
          </div>
          ${feedbackBlock}
        `;
        container.appendChild(qCard);
      });
    }

    function handleSelectOption(questionId, selectedKey) {
      userAnswers[questionId] = selectedKey;
      renderNavigation();

      const sec = videoSections[currentSectionIndex];
      if (sectionGraded[sec.id]) {
        renderCurrentSection();
      } else {
        const card = document.getElementById(`card_${questionId}`);
        const inputs = card.querySelectorAll('input[type="radio"]');
        inputs.forEach(input => {
          const parent = input.closest('label');
          const badge = parent.querySelector('span:first-of-type');
          if (input.value === selectedKey) {
            parent.className = "relative flex items-center p-3 sm:p-3.5 rounded-xl border transition-all cursor-pointer select-none border-indigo-600 bg-indigo-50/80 font-semibold ring-1 ring-indigo-600";
            badge.className = "w-7 h-7 rounded-lg flex items-center justify-center font-bold text-xs shrink-0 mr-3 transition bg-indigo-600 text-white";
          } else {
            parent.className = "relative flex items-center p-3 sm:p-3.5 rounded-xl border transition-all cursor-pointer select-none border-slate-200 hover:border-indigo-300 hover:bg-slate-50";
            badge.className = "w-7 h-7 rounded-lg flex items-center justify-center font-bold text-xs shrink-0 mr-3 transition bg-slate-100 text-slate-700";
          }
        });
      }
    }

    function toggleVideoEmbed(youtubeId) {
      const container = document.getElementById('videoEmbedContainer');
      const iframe = document.getElementById('videoIframe');
      const btn = document.getElementById('toggleEmbedBtn');

      if (container.classList.contains('hidden')) {
        iframe.src = `https://www.youtube.com/embed/${youtubeId}?autoplay=1`;
        container.classList.remove('hidden');
        btn.innerHTML = `<i class="fa-solid fa-eye-slash text-xs"></i> Ocultar`;
      } else {
        iframe.src = "";
        container.classList.add('hidden');
        btn.innerHTML = `<i class="fa-solid fa-play text-xs"></i> Reproductor aquí`;
      }
    }

    function gradeCurrentSection() {
      const sec = videoSections[currentSectionIndex];
      let correct = 0;
      const total = sec.questions.length;

      sec.questions.forEach(q => {
        if (userAnswers[q.id] === q.correct) correct++;
      });

      sectionGraded[sec.id] = true;
      renderCurrentSection();
      renderNavigation();

      if (correct === total) {
        playSuccessSound();
        showToast(`¡Puntaje perfecto en Sección ${sec.id}! (${correct}/${total})`, "success");
      } else if (correct >= Math.ceil(total * 0.7)) {
        playSuccessSound();
        showToast(`¡Buen trabajo en Sección ${sec.id}! Aciertos: ${correct} de ${total}`, "info");
      } else {
        playErrorSound();
        showToast(`Sección ${sec.id}: ${correct} de ${total}. ¡Revisa las explicaciones!`, "warning");
      }
    }

    function resetCurrentSection() {
      const sec = videoSections[currentSectionIndex];
      sec.questions.forEach(q => {
        delete userAnswers[q.id];
      });
      delete sectionGraded[sec.id];
      renderCurrentSection();
      renderNavigation();
      showToast(`Sección ${sec.id} reiniciada`, "info");
    }

    function resetAllQuiz() {
      Object.keys(userAnswers).forEach(key => delete userAnswers[key]);
      Object.keys(sectionGraded).forEach(key => delete sectionGraded[key]);
      renderCurrentSection();
      renderNavigation();
      showToast("Cuestionario reiniciado por completo", "info");
    }

    function updateOverallMetrics() {
      let totalQuestions = 0;
      let totalCorrect = 0;
      let totalAnswered = 0;

      videoSections.forEach(sec => {
        totalQuestions += sec.questions.length;
        sec.questions.forEach(q => {
          if (userAnswers[q.id]) {
            totalAnswered++;
            if (userAnswers[q.id] === q.correct) totalCorrect++;
          }
        });
      });

      const percent = Math.round((totalCorrect / totalQuestions) * 100);
      document.getElementById('headerScore').innerText = `${totalCorrect} / ${totalQuestions} (${percent}%)`;
      
      const answeredPercent = Math.round((totalAnswered / totalQuestions) * 100);
      document.getElementById('overallProgressBar').style.width = `${answeredPercent}%`;
    }

    function openGlobalSummaryModal() {
      const content = document.getElementById('summaryContent');
      let totalQuestions = 0;
      let totalCorrect = 0;
      let totalAnswered = 0;
      let sectionCardsHTML = '';

      videoSections.forEach(sec => {
        const secTotal = sec.questions.length;
        totalQuestions += secTotal;
        let secCorrect = 0;
        let secAnswered = 0;

        sec.questions.forEach(q => {
          if (userAnswers[q.id]) {
            secAnswered++;
            if (userAnswers[q.id] === q.correct) secCorrect++;
          }
        });

        totalCorrect += secCorrect;
        totalAnswered += secAnswered;
        const secPercent = Math.round((secCorrect / secTotal) * 100);
        const isGraded = !!sectionGraded[sec.id];

        sectionCardsHTML += `
          <div class="p-3 rounded-xl border border-slate-200 bg-slate-50 flex items-center justify-between">
            <div class="space-y-0.5 max-w-[70%]">
              <div class="flex items-center gap-1.5">
                <span class="text-[11px] font-bold px-1.5 py-0.5 rounded bg-white text-slate-700 border border-slate-200">#${sec.id}</span>
                <h4 class="text-xs sm:text-sm font-semibold text-slate-800 truncate">${sec.title}</h4>
              </div>
              <p class="text-[11px] text-slate-500">${secAnswered} de ${secTotal} respondidas • ${isGraded ? 'Calificada' : 'Sin calificar'}</p>
            </div>
            <div class="text-right">
              <span class="text-sm sm:text-base font-bold ${secPercent >= 70 ? 'text-emerald-600' : 'text-slate-700'}">${secCorrect} / ${secTotal}</span>
              <div class="text-[10px] text-slate-400">${secPercent}% aciertos</div>
            </div>
          </div>
        `;
      });

      const globalPercent = Math.round((totalCorrect / totalQuestions) * 100);

      content.innerHTML = `
        <div class="grid grid-cols-3 gap-2 sm:gap-3 p-3 sm:p-4 bg-indigo-50/60 rounded-xl border border-indigo-100 text-center mb-3">
          <div>
            <div class="text-[10px] sm:text-xs text-indigo-700 font-semibold uppercase">Respondidas</div>
            <div class="text-base sm:text-xl font-bold text-slate-900">${totalAnswered} / ${totalQuestions}</div>
          </div>
          <div>
            <div class="text-[10px] sm:text-xs text-indigo-700 font-semibold uppercase">Aciertos</div>
            <div class="text-base sm:text-xl font-bold text-emerald-600">${totalCorrect}</div>
          </div>
          <div>
            <div class="text-[10px] sm:text-xs text-indigo-700 font-semibold uppercase">Calificación</div>
            <div class="text-base sm:text-xl font-bold text-indigo-700">${globalPercent}%</div>
          </div>
        </div>

        <h3 class="text-[10px] sm:text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Desglose por Módulo de Video</h3>
        <div class="space-y-2">
          ${sectionCardsHTML}
        </div>
      `;

      document.getElementById('summaryModal').classList.remove('hidden');
    }

    function closeModal(modalId) {
      document.getElementById(modalId).classList.add('hidden');
    }

    function exportResultsSummary() {
      let report = `=== REPORTE DE EVALUACIÓN: COMUNICACIÓN & ORATORIA ===\n`;
      let totalQ = 0;
      let totalC = 0;

      videoSections.forEach(sec => {
        let secC = 0;
        sec.questions.forEach(q => {
          totalQ++;
          if (userAnswers[q.id] === q.correct) {
            secC++;
            totalC++;
          }
        });
        report += `• ${sec.title}: ${secC}/${sec.questions.length} correctas\n`;
      });

      report += `------------------------------------------------------\n`;
      report += `PUNTAJE GLOBAL: ${totalC} / ${totalQ} (${Math.round((totalC/totalQ)*100)}%)\n`;

      const dummy = document.createElement("textarea");
      document.body.appendChild(dummy);
      dummy.value = report;
      dummy.select();
      document.execCommand("copy");
      document.body.removeChild(dummy);

      showToast("Reporte copiado al portapapeles", "success");
    }

    function showToast(message, type = "info") {
      const toast = document.getElementById('toast');
      const toastInner = document.getElementById('toastInner');
      const toastIcon = document.getElementById('toastIcon');
      const toastMessage = document.getElementById('toastMessage');

      toastMessage.innerText = message;
      if (type === "success") {
        toastIcon.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-600 text-base"></i>`;
        toastInner.className = "flex items-center gap-2.5 px-3.5 py-2.5 rounded-xl shadow-lg border text-xs sm:text-sm font-semibold bg-emerald-50 text-emerald-950 border-emerald-200";
      } else if (type === "warning") {
        toastIcon.innerHTML = `<i class="fa-solid fa-circle-exclamation text-amber-600 text-base"></i>`;
        toastInner.className = "flex items-center gap-2.5 px-3.5 py-2.5 rounded-xl shadow-lg border text-xs sm:text-sm font-semibold bg-amber-50 text-amber-950 border-amber-200";
      } else {
        toastIcon.innerHTML = `<i class="fa-solid fa-circle-info text-indigo-600 text-base"></i>`;
        toastInner.className = "flex items-center gap-2.5 px-3.5 py-2.5 rounded-xl shadow-lg border text-xs sm:text-sm font-semibold bg-white text-slate-800 border-slate-200";
      }

      toast.classList.remove('translate-y-20', 'opacity-0');
      setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 3000);
    }

    window.onload = function() {
      renderNavigation();
      renderCurrentSection();
    };
  </script>
</body>
</html>
